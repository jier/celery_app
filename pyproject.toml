[project]
name = "observable-imports"
version = "0.1.0"
description = "Observable product inventory imports with Celery and Supabase"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "celery[redis]>=5.6.3",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
disallow_incomplete_defs = true
explicit_package_bases = true
files = ["workflow_app", "tests"]
